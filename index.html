<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header with title -->
    <header class="app-header">
      <h1 class="app-title">Random Quote Generator</h1>
    </header>

    <!-- Main Quote Card -->
    <main class="quote-card">
      <blockquote class="quote-box">
        <p id="quote-text" class="quote-text"></p>
        <footer id="quote-author" class="quote-author"></footer>
      </blockquote>
      <button id="new-quote-btn" class="new-quote-btn" type="button">New Quote</button>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>CodeAlpha Internship – Task 2</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
